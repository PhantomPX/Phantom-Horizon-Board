[platformio]
src_dir = src

[env:stm32g431]
platform = ststm32
board = nucleo_g431kb
framework = arduino
build_src_filter = +<*> -<esp32/>
monitor_speed = 115200

[env:xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
build_src_filter = +<*> -<stm32/>
monitor_speed = 115200